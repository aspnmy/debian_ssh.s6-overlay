version: '3.8'

networks:
  rdma-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.66.0.0/16

services:
  rdma-node1:
    image: ghcr.io/aspnmy/debian_ssh.s6-overlay:rdma-baseimage-s6-overlay_v3.2.3.0_2026051500-zstd-lts-zstd-lts-oci-latest
    container_name: ${port01}-rdma-node1
    hostname: rdma-node1
    privileged: true
    networks:
      rdma-net:
        ipv4_address: 172.66.0.2
    ports:
      - "${port01}:622"
    volumes:
      - /lib/modules:/lib/modules:ro
      - /dev/infiniband:/dev/infiniband
    tty: true
    restart: unless-stopped

  rdma-node2:
    image: ghcr.io/aspnmy/debian_ssh.s6-overlay:rdma-baseimage-s6-overlay_v3.2.3.0_2026051500-zstd-lts-zstd-lts-oci-latest
    container_name: ${port02}-rdma-node2
    hostname: rdma-node2
    privileged: true
    networks:
      rdma-net:
        ipv4_address: 172.66.0.3
    ports:
      - "${port02}:622"
    volumes:
      - /lib/modules:/lib/modules:ro
      - /dev/infiniband:/dev/infiniband
    tty: true
    restart: unless-stopped