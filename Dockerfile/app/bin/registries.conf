# /etc/containers/registries.conf
# 基础配置
unqualified-search-registries = ["docker.io"]
short-name-mode = "permissive"

# Docker Hub 镜像加速
[[registry]]
prefix = "docker.io"
location = "docker.io"
insecure = false

[[registry.mirror]]
location = "hub-mirror.c.163.com"

[[registry.mirror]]
location = "mirror.aliyuncs.com"

# GHCR 镜像加速
[[registry]]
prefix = "ghcr.io"
location = "ghcr.io"
insecure = false

[[registry.mirror]]
location = "ghcr.nju.edu.cn"

# Quay 镜像加速
[[registry]]
prefix = "quay.io"
location = "quay.io"
insecure = false

[[registry.mirror]]
location = "quay.mirrors.ustc.edu.cn"
