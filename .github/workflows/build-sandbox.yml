name: Build Sandbox Images

on:
  push:
    branches: [baseimage]
    paths:
      - 'base/**'
      - 'variants/**'
      - '.github/workflows/build-sandbox.yml'
  workflow_dispatch:
    inputs:
      s6_version:
        description: 's6-overlay version'
        required: false
        default: '3.2.3.0'
      build_base:
        description: 'Force rebuild base image'
        type: boolean
        default: false

env:
  S6_VER: ${{ inputs.s6_version || '3.2.3.0' }}
  REGISTRY: ghcr.io

jobs:
  # ═══════════════════════════════════════════
  # Job 0: Detect changes
  # ═══════════════════════════════════════════
  changes:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.filter.outputs.base }}
      variant_622: ${{ steps.filter.outputs.variant_622 }}
      variant_7777: ${{ steps.filter.outputs.variant_7777 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            base:
              - 'base/**'
              - '.github/workflows/build-sandbox.yml'
            variant_622:
              - 'variants/622-cross-compile/**'
              - '.github/workflows/build-sandbox.yml'
            variant_7777:
              - 'variants/7777-docker-build/**'
              - '.github/workflows/build-sandbox.yml'

  # ═══════════════════════════════════════════
  # Job 1: Build & Push Base Image
  # ═══════════════════════════════════════════
  build-base:
    needs: changes
    if: needs.changes.outputs.base == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Read base image config
        id: config
        run: |
          BASEIMAGE=$(grep -oP 'BASEIMAGE=\K.*' base/config/debian-base.md 2>/dev/null || echo "debian:bookworm-slim")
          echo "baseimage=${BASEIMAGE}" >> $GITHUB_OUTPUT
          echo "BASEIMAGE=${BASEIMAGE}"

      - name: Download s6-overlay tarballs
        run: |
          DL_DIR="base/s6-downloads"
          rm -rf "$DL_DIR" && mkdir -p "$DL_DIR"
          BASE_URL="https://github.com/just-containers/s6-overlay/releases/download/v${{ env.S6_VER }}"
          for F in s6-overlay-noarch.tar.xz s6-overlay-x86_64.tar.xz s6-overlay-aarch64.tar.xz; do
            echo "Downloading ${F}..."
            curl -fsSL --retry 5 --retry-delay 10 --retry-max-time 120 "${BASE_URL}/${F}" -o "${DL_DIR}/${F}"
          done
          ls -la "$DL_DIR"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGE_PAT }}

      - name: Generate metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "base_tag=base-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: ./base
          file: ./base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASEIMAGE=${{ steps.config.outputs.baseimage }}
            S6_VER=${{ env.S6_VER }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/sandbox-base:base-latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/sandbox-base:${{ steps.meta.outputs.base_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════
  # Job 2: Build & Push 622 Cross-Compile
  # ═══════════════════════════════════════════
  build-622:
    needs: [changes, build-base]
    if: |
      always() &&
      (needs.changes.outputs.variant_622 == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGE_PAT }}

      - name: Generate metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push 622 variant
        uses: docker/build-push-action@v6
        with:
          context: ./variants/622-cross-compile
          file: ./variants/622-cross-compile/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_REGISTRY=${{ env.REGISTRY }}/${{ github.repository_owner }}
            BASE_TAG=base-latest
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/sandbox-622:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/sandbox-622:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════
  # Job 3: Build & Push 7777 Docker Build
  # ═══════════════════════════════════════════
  build-7777:
    needs: [changes, build-base]
    if: |
      always() &&
      (needs.changes.outputs.variant_7777 == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGE_PAT }}

      - name: Generate metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push 7777 variant
        uses: docker/build-push-action@v6
        with:
          context: ./variants/7777-docker-build
          file: ./variants/7777-docker-build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_REGISTRY=${{ env.REGISTRY }}/${{ github.repository_owner }}
            BASE_TAG=base-latest
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/sandbox-7777:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/sandbox-7777:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════
  # Job 4: Summary
  # ═══════════════════════════════════════════
  summary:
    needs: [build-base, build-622, build-7777]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "=== Build Results ==="
          echo "Base:   ${{ needs.build-base.result }}"
          echo "622:    ${{ needs.build-622.result }}"
          echo "7777:   ${{ needs.build-7777.result }}"
