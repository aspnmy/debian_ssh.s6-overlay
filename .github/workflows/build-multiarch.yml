name: Build Multi-Arch Image

on:
  push:
    branches: [baseimage]
    paths:
      - 'Dockerfile/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      s6_version:
        description: 's6-overlay version'
        required: false
        default: '3.2.3.0'

env:
  S6_VER: ${{ inputs.s6_version || '3.2.3.0' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read base image config
        id: config
        run: |
          BASEIMAGE=$(grep BASEIMAGE Dockerfile/debian/debian-base.md | cut -d= -f2)
          echo "baseimage=${BASEIMAGE}" >> $GITHUB_OUTPUT
          echo "BASEIMAGE: ${BASEIMAGE}"

      - name: Download s6-overlay tarballs
        run: |
          S6_VER="${{ env.S6_VER }}"
          DL_DIR="Dockerfile/s6-downloads"
          mkdir -p "$DL_DIR"
          BASE_URL="https://github.com/just-containers/s6-overlay/releases/download/v${S6_VER}"
          for F in s6-overlay-noarch.tar.xz s6-overlay-x86_64.tar.xz s6-overlay-aarch64.tar.xz; do
            echo "Downloading ${F}..."
            curl -fsSL --retry 5 --retry-delay 10 --retry-max-time 120 "${BASE_URL}/${F}" -o "${DL_DIR}/${F}"
          done
          ls -la "$DL_DIR"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGE_PAT }}

      - name: Generate metadata
        id: meta
        run: |
          TIMESTAMP=$(date +"%Y%m%d%H")
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VER_TAG="v${S6_VER}-${TIMESTAMP}"
          echo "ver_tag=${VER_TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: ./Dockerfile
          file: ./Dockerfile/debian/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASEIMAGE=${{ steps.config.outputs.baseimage }}
            S6_VER=${{ env.S6_VER }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/debian_ssh.s6-overlay:baseimage-${{ steps.meta.outputs.ver_tag }}
            ghcr.io/${{ github.repository_owner }}/debian_ssh.s6-overlay:baseimage-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
